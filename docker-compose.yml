services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-whatsapp_ops}
      POSTGRES_USER: ${POSTGRES_USER:-whatsapp_ops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only}
    ports:
      - "5433:5432"
    volumes:
      - whatsapp_ops_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-whatsapp_ops} -d ${POSTGRES_DB:-whatsapp_ops}"]
      interval: 5s
      timeout: 3s
      retries: 15

volumes:
  whatsapp_ops_postgres:
